[project]
name = "knowledge-hub-backend"
version = "1.0.0"
description = "Knowledge Hub backend (FastAPI port of the original NestJS service)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "motor>=3.6",
    "redis>=5.2",
    "aio-pika>=9.5",
    "elasticsearch[async]>=8.17,<9",
    "neo4j>=5.27",
    "httpx>=0.28",
    "PyJWT>=2.10",
    "bcrypt>=4.2",
    "aiosmtplib>=4.0",
    "boto3>=1.35",
    "python-multipart>=0.0.17",
    "langchain>=1.0",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "langchain-text-splitters>=1.0",
    "langgraph>=1.0",
    "mem0ai>=0.1.90",
    "markdownify>=0.14",
    "pypdf>=5.1",
    "pdfplumber>=0.11",
    "mammoth>=1.8",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
